<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32 Practice Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-chip" aria-hidden="true"></span>
    <span class="brand-name">ESP32 Practice Bench</span>
  </div>
  <nav class="steps" id="steps" aria-label="Lessons"></nav>
  <div class="progress" id="progress"></div>
</header>

<main class="layout">
  <section class="pane lesson" id="lesson" aria-labelledby="lesson-title"></section>

  <section class="pane code" aria-label="Code editor">
    <div class="toolbar">
      <button class="btn primary" id="run" type="button" title="Run (Ctrl+Enter)">Run</button>
      <button class="btn" id="check" type="button">Check my code</button>
      <span class="spacer"></span>
      <button class="btn quiet" id="reset-code" type="button">Start over</button>
    </div>
    <div class="editor" id="editor">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <div class="edit-area">
        <div class="err-band" id="err-band" hidden></div>
        <pre class="hl" id="hl" aria-hidden="true"></pre>
        <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Your sketch"></textarea>
      </div>
    </div>
    <div class="status" id="status" role="status"></div>
    <div class="results" id="results" aria-live="polite"></div>
  </section>

  <section class="pane bench" aria-label="Virtual board">
    <div class="bench-head">
      <span class="label">Board</span>
      <span class="clock" id="clock">stopped</span>
      <span class="spacer"></span>
      <button class="btn quiet small" id="sound" type="button" aria-pressed="false">Sound off</button>
    </div>
    <div class="board-wrap" id="board"></div>
    <div class="pot-row">
      <label for="pot-range">Knob <span class="mono">GPIO 34</span></label>
      <input type="range" id="pot-range" min="0" max="4095" value="0">
      <output id="pot-out" class="mono" for="pot-range">0</output>
    </div>
    <div class="serial">
      <div class="serial-head">
        <span class="label">Serial monitor</span>
        <span class="mono baud" id="baud">115200 baud</span>
        <span class="spacer"></span>
        <button class="btn quiet small" id="serial-clear" type="button">Clear</button>
      </div>
      <pre class="serial-out" id="serial-out" tabindex="0" aria-label="Serial output"></pre>
      <form class="serial-in" id="serial-form">
        <input id="serial-text" type="text" placeholder="Type a message for the board" autocomplete="off" aria-label="Message to send">
        <button class="btn small" type="submit">Send</button>
      </form>
    </div>
  </section>
</main>

<script src="js/interpreter.js"></script>
<script src="js/board.js"></script>
<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
